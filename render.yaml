databases:
  - name: ctcj-db
    plan: free
    databaseName: ctcj
    user: ctcj

services:
  - type: web
    name: ctcj-platform
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ctcj-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: '900'
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: REFRESH_COOKIE_NAME
        value: ctcj_refresh
      # Set after the service's first deploy, once its real onrender.com
      # URL (or a custom domain) is known -- see the Render dashboard.
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Production email goes through Resend (Mailhog is dev-only). The
      # server refuses to boot without these -- see src/config/env.js.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Only needed once, to run scripts/bootstrapAdmin.js from the Render
      # shell; delete it after the first administrator exists.
      - key: BOOTSTRAP_TOKEN
        sync: false
