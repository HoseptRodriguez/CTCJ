name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctcj
          POSTGRES_PASSWORD: ctcj_dev_password
          POSTGRES_DB: ctcj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctcj -d ctcj_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://ctcj:ctcj_dev_password@localhost:5432/ctcj_test?schema=public'
      # Test-only secret (never a production credential) -- required, no
      # default, by src/config/env.js's zod schema. .env.test provides this
      # locally but is correctly gitignored, so CI needs its own copy.
      JWT_ACCESS_SECRET: 'ci-test-secret-not-for-production-use-only'
      # Test-only key; MFA enforcement off except in the MFA tests themselves.
      MFA_ENCRYPTION_KEY: 'Y3Rjai10ZXN0LW9ubHktbWZhLWtleS0wMDAwMDAwMDA='
      MFA_ENFORCE_STAFF: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Architecture rules (dependency-cruiser)
        run: npm run lint:arch

      - name: Apply database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Seed reference data
        working-directory: apps/backend
        run: node prisma/seed.js

      - name: Unit tests
        working-directory: apps/backend
        run: npx vitest run

      - name: Integration tests
        working-directory: apps/backend
        run: npx vitest run --config vitest.integration.config.js

      # Includes the accessibility checks (axe-core, WCAG 2.1 AA): a serious
      # or critical violation fails the build.
      - name: Frontend tests (incl. accessibility)
        working-directory: apps/frontend
        run: npx vitest run

      # Fails if a photo of a minor without authorization would be published.
      - name: Frontend production build
        run: npm run build -w apps/frontend
